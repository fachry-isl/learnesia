# Local development — hot reload via bind mounts.
# Usage: docker compose up --build
# Do NOT merge with docker-compose.prod.yml (separate project name + services).
name: learnesia-dev

services:
  backend-dev:
    image: learnesia-backend-dev
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  frontend-dev:
    image: learnesia-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      # SSR / server-side fetches inside the dev network
      - API_URL=http://backend-dev:8000/api
      # Browser / client bundle (host-visible URL)
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend-dev
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
